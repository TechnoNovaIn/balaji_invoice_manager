<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Offline - Balaji InvoiceHub</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 1.5rem;
        }
        .card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #0f172a;
            color: #14b8a6;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.35rem; margin: 0 0 0.75rem; }
        p { color: #475569; font-size: 0.95rem; line-height: 1.5; margin: 0 0 1.5rem; }
        button {
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0.65rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Balaji InvoiceHub</div>
        <h1>Internet Connection Required</h1>
        <p>
            Invoice submissions, financial records, and approvals require an active network connection.
            Reconnect to office Wi-Fi or mobile data and try again.
        </p>
        <button type="button" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
